# v0.1: infrastructure for later phases.
# The parser + CLI run without any containers.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legacybridge
      POSTGRES_PASSWORD: legacybridge
      POSTGRES_DB: legacybridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # v0.4+ : langfuse (LLM observability / eval tracing)
  # v0.5+ : mcp-server (TypeScript)
  # v0.6+ : dashboard (Next.js)

volumes:
  pgdata:
