name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore || echo "::warning::format drift — run dotnet format"

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --logger trx
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage

      - name: Coverage ≥80%
        run: |
          python3 - <<'PY'
          import glob, pathlib, sys, xml.etree.ElementTree as ET
          files = glob.glob('artifacts/coverage/**/coverage.cobertura.xml', recursive=True)
          if not files:
              sys.exit('no coverage.cobertura.xml produced')
          rates = []
          for f in files:
              root = ET.parse(f).getroot()
              for pkg in root.iter('package'):
                  name = pkg.get('name', '')
                  if 'LegacyBridge.Parser' in name and 'Tests' not in name:
                      rates.append(float(pkg.get('line-rate', 0)))
          if not rates:
              rates.append(float(ET.parse(files[0]).getroot().get('line-rate', 0)))
          pct = max(rates) * 100
          pathlib.Path('artifacts').mkdir(exist_ok=True)
          pathlib.Path('artifacts/coverage.txt').write_text(f'{pct:.1f}\n')
          print(f'Parser line coverage: {pct:.1f}%')
          if pct < 80:
              sys.exit(f'coverage {pct:.1f}% is below 80%')
          PY

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            artifacts/coverage/**/*.xml
            artifacts/coverage.txt
          if-no-files-found: warn

      - name: Smoke test — parse the bundled VFP sample
        run: dotnet run --project src/LegacyBridge.Cli --no-build --configuration Release -- analyze samples/vfp-inventory/legacy --output artifacts/ir.json

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/agents/package-lock.json

      - name: Install agents
        run: npm ci --prefix src/agents

      - name: Agent tests
        run: npm test --prefix src/agents

      - name: Extract business spec
        run: dotnet run --project src/LegacyBridge.Cli --no-build --configuration Release -- extract samples/vfp-inventory/legacy --output artifacts/spec.yaml

      - name: Eval extractor recall ≥ 0.8
        working-directory: src/agents
        run: npx tsx eval.ts --got ../../artifacts/spec.yaml --golden ../../samples/vfp-inventory/business-spec.expected.yaml --min-recall 0.8

      - name: Generate .NET 8 solution (must compile, 1 attempt)
        run: >
          dotnet run --project src/LegacyBridge.Cli --no-build --configuration Release --
          generate samples/vfp-inventory/legacy --output artifacts/migrated --build

      - name: Build committed migrated sample
        run: dotnet build samples/vfp-inventory/migrated/VfpInventory.sln --nologo

      - name: Upload IR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-ir
          path: |
            artifacts/ir.json
            artifacts/spec.yaml
